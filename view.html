<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>365Camera - 共有された写真</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d1014; color: #e8ecf1; font: 14px/1.5 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; touch-action: none; }
  #stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  .top { position: fixed; left: 0; right: 0; top: 0; padding: 12px 16px; display: flex; gap: 12px; justify-content: space-between; align-items: center; background: linear-gradient(#000a, transparent); z-index: 2; pointer-events: none; }
  .top a, .top button { pointer-events: auto; color: #fff; text-decoration: none; background: #ffffff22; border: 1px solid #ffffff33; border-radius: 10px; padding: 8px 14px; font: inherit; }
  .note { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); text-align: center; color: #cfd6df; font-size: 12px; background: linear-gradient(transparent, #000a); pointer-events: none; }
  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div class="top"><a href="/">365Cameraで撮る</a><a id="dl" href="#" download>保存</a></div>
<div id="stage"></div>
<div id="err">この写真は表示できません。リンクが正しいか確認してください。</div>
<div class="note" id="note"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search), u = q.get("u") || "", k = q.get("k") === "360";
  var ok = false;
  try { var h = new URL(u); ok = h.protocol === "https:" && /\.public\.blob\.vercel-storage\.com$/.test(h.hostname); } catch (e) {}
  var stage = document.getElementById("stage");
  if (!ok) { document.getElementById("err").style.display = "grid"; document.getElementById("dl").hidden = true; return; }
  document.getElementById("dl").href = u;
  var note = document.getElementById("note");
  if (!k) {
    var im = new Image(); im.alt = "共有された写真"; im.onerror = fail; im.src = u; stage.appendChild(im);
    note.textContent = "つまんで拡大できます。";
    return;
  }
  function fail() { stage.style.display = "none"; document.getElementById("err").style.display = "grid"; }
  note.textContent = "ドラッグで見回し、ホイールやピンチで拡大縮小できます。";
  var cv = document.createElement("canvas"); stage.appendChild(cv);
  var gl = cv.getContext("webgl");
  if (!gl) { stage.removeChild(cv); var im2 = new Image(); im2.src = u; stage.appendChild(im2); return; }
  function sh(t, s) { var o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; }
  var pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 p; varying vec2 v; void main(){ v=p; gl_Position=vec4(p,0.,1.); }"));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, "precision highp float; varying vec2 v; uniform sampler2D t; uniform vec2 yp; uniform float f, asp;" +
    "void main(){ vec3 d=normalize(vec3(v.x*asp*f, v.y*f, -1.)); float cp=cos(yp.y), sp=sin(yp.y), cy=cos(yp.x), sy=sin(yp.x);" +
    "d=vec3(d.x, d.y*cp-d.z*sp, d.y*sp+d.z*cp); d=vec3(d.x*cy+d.z*sy, d.y, -d.x*sy+d.z*cy);" +
    "float lon=atan(d.x,-d.z), lat=asin(clamp(d.y,-1.,1.)); gl_FragColor=texture2D(t, vec2(lon/6.2831853+.5, .5-lat/3.14159265)); }"));
  gl.linkProgram(pr); gl.useProgram(pr);
  var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var yaw = 0, pitch = 0, fov = 1.0, ready = false, tex = gl.createTexture();
  var img = new Image(); img.crossOrigin = "anonymous"; img.onerror = fail;
  img.onload = function () {
    var s = Math.min(1, gl.getParameter(gl.MAX_TEXTURE_SIZE) / img.width), src = img;
    if (s < 1) { src = document.createElement("canvas"); src.width = Math.floor(img.width * s); src.height = Math.floor(img.height * s); src.getContext("2d").drawImage(img, 0, 0, src.width, src.height); }
    gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    ready = true; draw();
  };
  img.src = u;
  function draw() {
    if (!ready) return;
    var r = window.devicePixelRatio || 1, w = Math.round(cv.clientWidth * r), h = Math.round(cv.clientHeight * r);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    gl.viewport(0, 0, w, h);
    gl.uniform2f(gl.getUniformLocation(pr, "yp"), yaw, pitch); gl.uniform1f(gl.getUniformLocation(pr, "f"), Math.tan(fov / 2));
    gl.uniform1f(gl.getUniformLocation(pr, "asp"), w / h); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  var pts = {}, last = 0;
  cv.addEventListener("pointerdown", function (e) { cv.setPointerCapture(e.pointerId); pts[e.pointerId] = [e.clientX, e.clientY]; last = 0; });
  cv.addEventListener("pointerup", function (e) { delete pts[e.pointerId]; last = 0; });
  cv.addEventListener("pointercancel", function (e) { delete pts[e.pointerId]; last = 0; });
  cv.addEventListener("pointermove", function (e) {
    var p = pts[e.pointerId]; if (!p) return;
    var ids = Object.keys(pts);
    if (ids.length >= 2) {
      var o = pts[ids[0] == e.pointerId ? ids[1] : ids[0]], d0 = Math.hypot(p[0] - o[0], p[1] - o[1]), d1 = Math.hypot(e.clientX - o[0], e.clientY - o[1]);
      if (last) fov = Math.min(2.2, Math.max(0.35, fov * last / d1)); last = d1;
    } else {
      var k2 = fov / cv.clientHeight; yaw -= (e.clientX - p[0]) * k2; pitch = Math.max(-1.5, Math.min(1.5, pitch + (e.clientY - p[1]) * k2));
    }
    pts[e.pointerId] = [e.clientX, e.clientY]; draw();
  });
  cv.addEventListener("wheel", function (e) { e.preventDefault(); fov = Math.min(2.2, Math.max(0.35, fov * (1 + e.deltaY * 0.001))); draw(); }, { passive: false });
  window.addEventListener("resize", draw);
})();
</script>
</body>
</html>
